[project]
name = "superintendent-disambiguation"
version = "0.1.0"
description = "CLI tool to disambiguate superintendent records across school districts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openrouter]",
    "pydantic>=2.0",
    "click>=8.0",
    "openpyxl>=3.1.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "trafilatura>=1.6.0",
    "curl-cffi>=0.7.0",
    "httpx-curl-cffi>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
disambiguate = "main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]  # E501: docstrings; E402: load_dotenv() before imports

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.8",
]
